<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in | Kestrel Bank NetBanking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="login">
  <div class="login-wrap">
    <a class="brand login-brand" href="/">
      <svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><rect width="40" height="40" rx="9" fill="#b8893b"/><path d="M8 24c5-1 8-4 10-9l3 5 4-7 7 11c-4-2-8-2-12 0-4-2-8-2-12 0Z" fill="#0f3d3a"/></svg>
      Kestrel Bank
    </a>

    <div class="panel">
      <!-- Step 1 -->
      <form id="step1" novalidate>
        <h2>Sign in to NetBanking</h2>
        <p class="sub">Enter your registered email, mobile number or account number. We'll send you a one-time password.</p>
        <label for="identifier">Email, mobile number or account number</label>
        <input class="field" id="identifier" name="identifier" type="text" autocomplete="username" placeholder="Email, mobile or account number" required autofocus>
        <button class="btn" id="sendBtn" type="submit">Send OTP</button>
        <div class="msg" id="msg1" role="status" aria-live="polite"></div>
      </form>

      <!-- Step 2 -->
      <form id="step2" class="hidden" novalidate>
        <h2>Enter your OTP</h2>
        <p class="sub" id="sentInfo">We sent a 6-digit code.</p>
        <div class="otp-boxes" id="otpBoxes" role="group" aria-label="One-time password">
          <input id="o0" inputmode="numeric" maxlength="1" autocomplete="one-time-code" aria-label="Digit 1">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 2">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 3">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 4">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 5">
          <input inputmode="numeric" maxlength="1" aria-label="Digit 6">
        </div>
        <button class="btn" id="verifyBtn" type="submit">Verify and sign in</button>
        <div class="row">
          <button type="button" class="link-btn" id="changeBtn">Go back</button>
          <button type="button" class="link-btn" id="resendBtn" disabled>Resend OTP</button>
        </div>
        <div class="msg" id="msg2" role="status" aria-live="polite"></div>
      </form>
    </div>

  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const step1 = $('step1'), step2 = $('step2');
const boxes = [...document.querySelectorAll('#otpBoxes input')];
let identifier = '', timer = null;

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json().catch(() => ({ ok: false, message: 'Something went wrong. Try again.' }));
}
function say(el, text, ok) { el.textContent = text; el.className = 'msg ' + (ok ? 'ok' : 'err'); }

function startCooldown(sec) {
  const btn = $('resendBtn'); clearInterval(timer); btn.disabled = true;
  const tick = () => { btn.textContent = sec > 0 ? `Resend OTP in ${sec}s` : 'Resend OTP'; if (sec <= 0) { btn.disabled = false; clearInterval(timer); } sec--; };
  tick(); timer = setInterval(tick, 1000);
}

async function sendOtp() {
  const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'Sending…';
  const res = await post('/api/request-otp', { identifier });
  btn.disabled = false; btn.textContent = 'Send OTP';
  return res;
}

step1.addEventListener('submit', async (e) => {
  e.preventDefault();
  identifier = $('identifier').value.trim();
  if (!identifier) return say($('msg1'), 'Enter your email, mobile number or account number.');
  const res = await sendOtp();
  if (!res.ok) return say($('msg1'), res.message);
  step1.classList.add('hidden'); step2.classList.remove('hidden');
  $('sentInfo').textContent = `We sent a 6-digit code to ${res.sentTo}. It's valid for 5 minutes.`;
  boxes.forEach(b => b.value = ''); boxes[0].focus(); say($('msg2'), '', true);
  startCooldown(res.cooldown || 30);
});

$('resendBtn').addEventListener('click', async () => {
  const res = await sendOtp();
  if (!res.ok) return say($('msg2'), res.message);
  say($('msg2'), 'A new OTP has been sent.', true);
  boxes.forEach(b => b.value = ''); boxes[0].focus(); startCooldown(res.cooldown || 30);
});

$('changeBtn').addEventListener('click', () => {
  clearInterval(timer); step2.classList.add('hidden'); step1.classList.remove('hidden');
  say($('msg1'), '', true); $('identifier').focus();
});

boxes.forEach((box, i) => {
  box.addEventListener('input', () => {
    box.value = box.value.replace(/\D/g, '').slice(-1);
    if (box.value && i < 5) boxes[i + 1].focus();
  });
  box.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' && !box.value && i > 0) boxes[i - 1].focus();
    if (e.key === 'ArrowLeft' && i > 0) boxes[i - 1].focus();
    if (e.key === 'ArrowRight' && i < 5) boxes[i + 1].focus();
  });
  box.addEventListener('paste', (e) => {
    const t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
    if (!t) return; e.preventDefault();
    t.split('').forEach((d, k) => boxes[k].value = d); boxes[Math.min(t.length, 5)].focus();
  });
});

step2.addEventListener('submit', async (e) => {
  e.preventDefault();
  const otp = boxes.map(b => b.value).join('');
  if (otp.length !== 6) return say($('msg2'), 'Enter all 6 digits.');
  const btn = $('verifyBtn'); btn.disabled = true; btn.textContent = 'Verifying…';
  const res = await post('/api/verify-otp', { identifier, otp });
  btn.disabled = false; btn.textContent = 'Verify and sign in';
  if (!res.ok) { boxes.forEach(b => b.value = ''); boxes[0].focus(); return say($('msg2'), res.message); }
  say($('msg2'), 'Verified. Signing you in…', true);
  location.href = res.redirect;
});
</script>
</body>
</html>
